[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentronsagent"
version = "0.1.0"
description = "MCP adapter for Opentrons robot/run APIs, protocol metadata review, simulation planning, and guarded local Opentrons command execution."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.11.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
]

[project.scripts]
opentronsagent = "opentronsagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentronsagent"]

[tool.uv]
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
