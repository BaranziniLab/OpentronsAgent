[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentronsagent"
version = "0.3.0"
description = "Simulate Opentrons Flex protocols with the opentrons package and look up the labware definitions it ships, plus Opentrons shared data on GitHub. Biorouter asks before each simulation, which runs the protocol's Python. No key needed."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
    "opentrons==10.1.0",
]

[project.scripts]
opentronsagent = "opentronsagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentronsagent"]

[tool.uv]
override-dependencies = [
    "jsonschema>=4.20,<5",
]
# cryptography (pulled in by fastmcp) has no Intel Mac wheels from 49 on.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
